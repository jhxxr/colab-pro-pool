name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  metadata:
    name: Validate release version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      image: ${{ steps.release.outputs.image }}
      latest: ${{ steps.release.outputs.latest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Validate versions, tag and latest release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: python scripts/release_metadata.py

  checks:
    name: Pre-release checks
    needs: metadata
    uses: ./.github/workflows/ci.yml

  images:
    name: Docker ${{ matrix.arch }}
    needs: [metadata, checks]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: labels
        with:
          images: ${{ needs.metadata.outputs.image }}
          labels: |
            org.opencontainers.image.version=${{ needs.metadata.outputs.version }}
            org.opencontainers.image.licenses=MIT
      - name: Build runtime image for smoke test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: colab-pro-pool:smoke
          labels: ${{ steps.labels.outputs.labels }}
          provenance: false
          cache-from: type=gha,scope=release-${{ matrix.arch }}
      - name: Verify CLI, frontend, health and API authentication
        run: bash scripts/smoke_container.sh colab-pro-pool:smoke
      - name: Push verified image by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          labels: ${{ steps.labels.outputs.labels }}
          outputs: type=image,name=${{ needs.metadata.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=release-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.arch }}
      - name: Export image digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish multi-platform image and GitHub Release
    needs: [metadata, checks, images]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      IMAGE: ${{ needs.metadata.outputs.image }}
      VERSION: ${{ needs.metadata.outputs.version }}
      TAG: ${{ needs.metadata.outputs.tag }}
      MAKE_LATEST: ${{ needs.metadata.outputs.latest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-distributions
          path: dist
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Create multi-platform manifest
        working-directory: ${{ runner.temp }}/digests
        run: |
          set -euo pipefail
          tags=(--tag "${IMAGE}:${TAG}" --tag "${IMAGE}:${VERSION}")
          if [[ "$MAKE_LATEST" == true ]]; then
            tags+=(--tag "${IMAGE}:latest")
          fi
          sources=()
          for digest in *; do
            sources+=("${IMAGE}@sha256:${digest}")
          done
          [[ ${#sources[@]} -eq 2 ]]
          docker buildx imagetools create "${tags[@]}" "${sources[@]}"
      - name: Verify published architectures and write image metadata
        run: |
          docker buildx imagetools inspect "${IMAGE}:${TAG}" --raw > dist/image-manifest.json
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          manifest = json.loads(Path('dist/image-manifest.json').read_text())
          platforms = {(entry['platform']['os'], entry['platform']['architecture'])
                       for entry in manifest['manifests']}
          assert {('linux', 'amd64'), ('linux', 'arm64')} <= platforms, platforms
          Path('dist/docker-image.txt').write_text(
              f"docker pull {os.environ['IMAGE']}:{os.environ['TAG']}\n"
              f"Source commit: {os.environ['GITHUB_SHA']}\n"
              "Platforms: linux/amd64, linux/arm64\n"
          )
          PY
      - name: Create checksums and release notes
        run: |
          (cd dist && sha256sum -- * > SHA256SUMS)
          cat > "$RUNNER_TEMP/release-notes.md" <<EOF
          ## Docker image

          \`\`\`bash
          docker pull ${IMAGE}:${TAG}
          \`\`\`

          Platforms: \`linux/amd64\`, \`linux/arm64\`.

          Python wheel and source distribution include the production web console.
          Verify downloaded assets with \`sha256sum -c SHA256SUMS\`.
          EOF
      - name: Publish GitHub Release with downloadable assets
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" --draft=false --prerelease=false --latest="$MAKE_LATEST"
          else
            gh release create "$TAG" dist/* \
              --target "$GITHUB_SHA" \
              --title "$TAG" \
              --notes-file "$RUNNER_TEMP/release-notes.md" \
              --generate-notes \
              --latest="$MAKE_LATEST"
          fi
          gh release view "$TAG" --json url,tagName,isDraft,isPrerelease
          if [[ "$MAKE_LATEST" == true ]]; then
            test "$(gh api "repos/${GH_REPO}/releases/latest" --jq .tag_name)" = "$TAG"
          fi
